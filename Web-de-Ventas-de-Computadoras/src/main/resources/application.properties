# ═══════════════════════════════════════════════════════════════════════════
#  MONOLITO RETIRADO — no se arranca
# ═══════════════════════════════════════════════════════════════════════════
#
#  Sustituido por los microservicios de la raíz:
#      web-gateway (8080) · catalogo (8081) · usuarios (8082) · compras (8083)
#
#  Se conserva el código solo como referencia histórica.
#
#  ---------------------------------------------------------------------------
#  TODA LA CONFIGURACIÓN SE MOVIÓ AL `.env` DE LA RAÍZ
#  ---------------------------------------------------------------------------
#
#      Antes (aquí)                          Ahora (.env)
#      ─────────────────────────────────     ──────────────────────────
#      spring.datasource.url                 DB_URL
#      spring.datasource.username            DB_USER
#      spring.datasource.password            DB_PASSWORD
#      mercadopago.access.token              MP_ACCESS_TOKEN
#      mercadopago.public.key                MP_PUBLIC_KEY
#      ...google.client-id                   GOOGLE_CLIENT_ID
#      ...google.client-secret               GOOGLE_CLIENT_SECRET
#      ...facebook.client-id                 FACEBOOK_CLIENT_ID
#      ...facebook.client-secret             FACEBOOK_CLIENT_SECRET
#      jwt.secret                            JWT_SECRET  (regenerado, 384 bits)
#      jwt.expiration.cliente                seguridad.jwt.expiracion-cliente
#      jwt.expiration.empleado               seguridad.jwt.expiracion-empleado
#      jwt.expiration.administrador          seguridad.jwt.expiracion-administrador
#      jwt.refreshExpiration                 seguridad.jwt.expiracion-refresh
#
#  El `.env` está en .gitignore. La plantilla versionada es `.env.example`.
#
#  ---------------------------------------------------------------------------
#  ⚠  AVISO
#  ---------------------------------------------------------------------------
#  Estas credenciales estuvieron versionadas en git y siguen en el historial.
#  Conviene rotarlas: contraseña de Neon, token de MercadoPago, client-secret
#  de Google y app-secret de Facebook.
# ═══════════════════════════════════════════════════════════════════════════

spring.application.name=Web-de-Ventas-de-Computadoras-RETIRADO
