<div th:fragment="mas-vendido">
    <section class="mas-vendidos py-4">
        <div class="container-fluid">
            <div class="row">
                <div class="col text-start">
                    <h4>Productos Top</h4>
                </div>
            </div>
        </div>

        <!-- CARRUSEL DE PRODUCTOS (Desktop) -->
        <div id="carouselProductosTop" class="carousel carousel-dark slide d-none d-lg-block" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div th:each="chunk, sChunk : ${productosTopChunks}" th:classappend="${sChunk.index == 0} ? ' active' : ''" class="carousel-item" data-bs-interval="10000">
                    <div class="row justify-content-center">

                        <!-- Promo fijo solo en la primera slide -->
                        <div th:if="${sChunk.index == 0}" class="col-md-2 col-sm-4 mb-3">
                            <a th:href="@{/Detalles(id=${'promo'})}" class="text-decoration-none">
                                <div class="card card-promo text-center text-white h-100">
                                     <img src="https://sigmatiendas.com/cdn/shop/articles/laptops_variadas_portada_blog.webp?v=1728322812&width=1200"
                                         class="card-img-top img-fluid p-3" alt="Promo"
                                         loading="lazy"
                                         onerror="this.onerror=null;this.src='/Img/Promo-laptops.jpg';">
                                    <div class="card-body">
                                        <h6 class="fw-bold mb-2">REPUBLIC OF GAMERS</h6>
                                        <p class="fw-semibold mb-1">TENEMOS LAS LAPTOPS<br>MAS POTENTES</p>
                                    </div>
                                </div>
                            </a>
                        </div>

                        <!-- Productos del chunk -->
                        <div th:each="p : ${chunk}" class="col-md-2 efectos-targetas col-sm-4 mb-3">
                            <a th:href="@{/Detalles(id=${p.id})}" class="text-decoration-none">
                                <div class="card card-producto h-100 shadow-sm rounded">
                                    <img th:src="${p.imageUrl != null ? p.imageUrl : '/Img/img.png'}" class="card-img-top img-fluid" th:alt="${p.name}">
                                    <div class="card-body">
                                        <h6 class="fw-bold mb-1 text-uppercase" th:text="${p.name}">Nombre</h6>
                                        <p class="fw-semibold mb-1 text-truncate" style="max-height:3rem;overflow:hidden;" th:text="${p.description}">Descripción</p>
                                        <p class="fw-bold fs-5 mt-2 precio" th:text="'S/. ' + ${p.precio}">Precio</p>
                                    </div>
                                </div>
                            </a>
                        </div>

                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselProductosTop" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselProductosTop" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- Scroll horizontal móvil -->
        <div class="d-lg-none d-flex overflow-auto py-3">
            <div th:each="p : ${productos}" class="flex-shrink-0 me-3 product-card-item">
                <a th:href="@{/Detalles(id=${p.id})}">
                    <div class="card card-producto">
                        <img th:src="${p.imageUrl != null ? p.imageUrl : '/Img/img.png'}" class="card-img-top img-fluid" th:alt="${p.name}">
                        <div class="card-body">
                            <h6 class="mb-1 fw-bold" th:text="${p.name}">Nombre</h6>
                            <p class="fw-semibold mb-1 text-truncate" style="max-height:3rem;overflow:hidden;" th:text="${p.description}">Descripción</p>
                            <p class="fw-bold" th:text="'S/. ' + ${p.precio}">Precio</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</div>
