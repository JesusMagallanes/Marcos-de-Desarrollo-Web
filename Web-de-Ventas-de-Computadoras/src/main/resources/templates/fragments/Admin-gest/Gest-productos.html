<!-- Modal añadir producto -->
<div class="modal fade" id="gest-product" tabindex="-1" aria-labelledby="gestProductLabel" aria-hidden="true"
    th:fragment="gest-productos">
    <div class="modal-dialog">
        <div class="modal-content"
            style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="gestProductLabel">Añadir nuevo producto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="idProducto" class="form-label">ID Producto</label>
                        <input type="number" class="form-control" id="idProducto" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nombreProducto" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombreProducto" required>
                    </div>
                    <div class="col-md-12">
                        <label for="descripcionProducto" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcionProducto" rows="3" required></textarea>
                    </div>
                    <div class="col-md-12">
                        <label for="imagenUrl" class="form-label">URL Imagen</label>
                        <input type="url" class="form-control" id="imagenUrl" placeholder="http://..." required>
                    </div>
                    <div class="col-md-6">
                        <label for="stockProducto" class="form-label">Stock</label>
                        <input type="number" class="form-control" id="stockProducto" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="precioProducto" class="form-label">Precio</label>
                        <input type="number" step="0.01" class="form-control" id="precioProducto" min="0" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Añadir producto</button>
            </div>
        </div>
    </div>
</div>
<!-- FIN Modal añadir producto -->

<!-- Modal editar producto -->
<div class="modal fade" id="edit-product" tabindex="-1" aria-labelledby="editProductLabel" aria-hidden="true"
    th:fragment="gest-productos">
    <div class="modal-dialog">
        <div class="modal-content"
            style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="editProductLabel">Editar producto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="idProducto-edit" class="form-label">ID Producto</label>
                        <input type="number" class="form-control" id="idProducto-edit" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nombreProducto-edit" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombreProducto-edit" required>
                    </div>
                    <div class="col-md-12">
                        <label for="descripcionProducto-edit" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcionProducto-edit" rows="3" required></textarea>
                    </div>
                    <div class="col-md-12">
                        <label for="imagenUrl-edit" class="form-label">URL Imagen</label>
                        <input type="url" class="form-control" id="imagenUrl-edit" placeholder="http://..." required>
                    </div>
                    <div class="col-md-6">
                        <label for="stockProducto-edit" class="form-label">Stock</label>
                        <input type="number" class="form-control" id="stockProducto-edit" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="precioProducto-edit" class="form-label">Precio</label>
                        <input type="number" step="0.01" class="form-control" id="precioProducto-edit" min="0" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-warning">Guardar cambios</button>
            </div>
        </div>
    </div>
</div>
<!-- FIN Modal editar producto -->
