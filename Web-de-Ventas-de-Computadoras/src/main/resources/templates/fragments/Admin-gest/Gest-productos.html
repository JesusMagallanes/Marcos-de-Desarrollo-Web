<div th:fragment="gest-productos">

    <div class="mb-3">
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-product">
            Añadir producto
        </button>
    </div>

    
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Imagen Url</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Marca</th>
                    <th style="min-width: 140px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}" class="text-truncate"></td>
                    <td th:text="${producto.name}" class="text-truncate" style="max-width: 150px;"></td>
                    <td th:text="${producto.description}" class="text-truncate" style="max-width: 200px;"></td>
                    <td th:text="${producto.precio}"></td>
                    <td>
                        <img th:src="${producto.imageUrl}" alt="Imagen" class="img-thumbnail" style="max-width: 80px;">
                    </td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${producto.categoriaName}"></td>
                    <td th:text="${producto.marcaName != null ? producto.marcaName : 'N/A'}"></td>
                    <td>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button type="button" class="btn btn-warning btn-sm"
                                th:attr="data-bs-target='#edit-product-' + ${producto.id}" data-bs-toggle="modal">
                                Editar
                            </button>

                            <form th:action="@{'/productos/eliminar/' + ${producto.id}}" method="post" class="m-0">
                                <button class="btn btn-danger btn-sm" type="submit"
                                    onclick="return confirm('¿Seguro que quieres eliminar este producto?');">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="gest-product" tabindex="-1" aria-labelledby="gestProductLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                <form th:action="@{/productos}" method="post" th:object="${producto}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="gestProductLabel">Añadir nuevo producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Mostrar mensaje de error general -->
                        <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                            <span th:text="${mensajeError}"></span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}" 
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" 
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" required></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Imagen</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}" 
                                   th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" class="form-control" th:field="*{stock}" min="0" 
                                       th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{precio}" min="0"
                                       th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoriaId}" id="categoriaSelect"
                                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid' : ''" 
                                    onchange="cargarMarcasPorCategoria(this.value, 'marcaSelect')" required>
                                <option value="">Seleccione una categoría</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <select class="form-select" th:field="*{marcaId}" id="marcaSelect"
                                    th:classappend="${#fields.hasErrors('marcaId')} ? 'is-invalid' : ''" required>
                                <option value="">Seleccione primero una categoría</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('marcaId')}" th:errors="*{marcaId}"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Añadir producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Script para reabrir el modal si hay errores -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var seccion = /*[[${seccion}]]*/ '';
            var hasErrors = /*[[${#fields.hasErrors('producto.*')}]]*/ false;
            
            console.log('Seccion:', seccion, 'Has Errors:', hasErrors);
            
            if (seccion === 'producto') {
                // Asegurar que la sección de productos esté visible
                setTimeout(function() {
                    const productosSection = document.getElementById('productos');
                    if (productosSection && productosSection.classList.contains('d-none')) {
                        const botonProductos = document.querySelector("button[onclick*=\"'productos'\"]");
                        if (botonProductos) {
                            mostrarSeccion('productos', botonProductos);
                        }
                    }
                    
                    // Si hay errores, abrir el modal
                    if (hasErrors) {
                        var modal = new bootstrap.Modal(document.getElementById('gest-product'));
                        modal.show();
                    }
                }, 100);
            }
        });
    </script>

    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'edit-product-' + ${producto.id}" tabindex="-1"
            aria-labelledby="editProductLabel" aria-hidden="true"
            th:attr="data-categoria-id=${producto.categoriaId}, data-marca-id=${producto.marcaId}, data-producto-id=${producto.id}">
            <div class="modal-dialog">
                <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                    <form th:action="@{'/productos/editar/' + ${producto.id}}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editProductLabel">Editar producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="name" th:value="${producto.name}"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="description" rows="3"
                                    th:text="${producto.description}" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL Imagen</label>
                                <input type="url" class="form-control" name="imageUrl" th:value="${producto.imageUrl}"
                                    required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock</label>
                                    <input type="number" class="form-control" name="stock" th:value="${producto.stock}"
                                        min="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio</label>
                                    <input type="number" step="0.01" class="form-control" name="precio"
                                        th:value="${producto.precio}" min="0" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" name="categoriaId" th:id="'categoriaSelectEdit-' + ${producto.id}"
                                        onchange="cargarMarcasPorCategoriaEdit(this.value, this.id)" required>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}"
                                        th:selected="${cat.id == producto.categoriaId}">
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Marca</label>
                                <select class="form-select" name="marcaId" th:id="'marcaSelectEdit-' + ${producto.id}" required>
                                    <option value="">Cargando marcas...</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-warning">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Script para cargar marcas al abrir modal de edición -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Detectar cuando se abre un modal de edición de producto
            document.querySelectorAll('[id^="edit-product-"]').forEach(function(modal) {
                modal.addEventListener('show.bs.modal', function(event) {
                    const categoriaId = this.getAttribute('data-categoria-id');
                    const marcaId = this.getAttribute('data-marca-id');
                    const productoId = this.getAttribute('data-producto-id');
                    
                    if (categoriaId && productoId) {
                        const marcaSelectId = 'marcaSelectEdit-' + productoId;
                        const marcaSelect = document.getElementById(marcaSelectId);
                        
                        if (!marcaSelect) return;
                        
                        // Mostrar estado de carga
                        marcaSelect.innerHTML = '<option value="">Cargando marcas...</option>';
                        marcaSelect.disabled = true;
                        
                        // Cargar marcas de la categoría
                        fetch(`/marcas/categoria/${categoriaId}`)
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error('Error al cargar marcas');
                                }
                                return response.json();
                            })
                            .then(marcas => {
                                marcaSelect.innerHTML = '<option value="">Seleccione una marca</option>';
                                
                                if (marcas && marcas.length > 0) {
                                    marcas.forEach(marca => {
                                        const option = document.createElement('option');
                                        option.value = marca.id;
                                        option.textContent = marca.name;
                                        
                                        // Seleccionar la marca actual del producto
                                        if (marca.id == marcaId) {
                                            option.selected = true;
                                        }
                                        
                                        marcaSelect.appendChild(option);
                                    });
                                } else {
                                    marcaSelect.innerHTML = '<option value="">No hay marcas disponibles</option>';
                                }
                                
                                marcaSelect.disabled = false;
                            })
                            .catch(error => {
                                console.error('Error cargando marcas para producto ' + productoId + ':', error);
                                marcaSelect.innerHTML = '<option value="">Error al cargar marcas</option>';
                                marcaSelect.disabled = false;
                            });
                    }
                });
            });
        });
    </script>

</div>
