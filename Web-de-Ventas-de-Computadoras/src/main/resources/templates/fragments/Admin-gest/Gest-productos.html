<div th:fragment="gest-productos">

    <div class="mb-3">
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-product">
            Añadir producto
        </button>
    </div>

    
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Imagen Url</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th style="min-width: 140px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}" class="text-truncate"></td>
                    <td th:text="${producto.name}" class="text-truncate" style="max-width: 150px;"></td>
                    <td th:text="${producto.description}" class="text-truncate" style="max-width: 200px;"></td>
                    <td th:text="${producto.precio}"></td>
                    <td>
                        <img th:src="${producto.imageUrl}" alt="Imagen" class="img-thumbnail" style="max-width: 80px;">
                    </td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${producto.categoriaName}"></td>
                    <td>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button type="button" class="btn btn-warning btn-sm"
                                th:attr="data-bs-target='#edit-product-' + ${producto.id}" data-bs-toggle="modal">
                                Editar
                            </button>

                            <form th:action="@{'/productos/eliminar/' + ${producto.id}}" method="post" class="m-0">
                                <button class="btn btn-danger btn-sm" type="submit"
                                    onclick="return confirm('¿Seguro que quieres eliminar este producto?');">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="gest-product" tabindex="-1" aria-labelledby="gestProductLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                <form th:action="@{/productos}" method="post" th:object="${producto}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="gestProductLabel">Añadir nuevo producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Imagen</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" class="form-control" th:field="*{stock}" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{precio}" min="0"
                                    required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoriaId}" required>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Añadir producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'edit-product-' + ${producto.id}" tabindex="-1"
            aria-labelledby="editProductLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                    <form th:action="@{'/productos/editar/' + ${producto.id}}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editProductLabel">Editar producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="name" th:value="${producto.name}"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="description" rows="3"
                                    th:text="${producto.description}" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL Imagen</label>
                                <input type="url" class="form-control" name="imageUrl" th:value="${producto.imageUrl}"
                                    required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock</label>
                                    <input type="number" class="form-control" name="stock" th:value="${producto.stock}"
                                        min="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio</label>
                                    <input type="number" step="0.01" class="form-control" name="precio"
                                        th:value="${producto.precio}" min="0" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" name="categoriaId" required>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}"
                                        th:selected="${cat.id == producto.categoriaName}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-warning">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
