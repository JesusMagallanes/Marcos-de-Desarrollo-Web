<div th:fragment="gest-productos">

    <div class="mb-3">
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-product">
            Añadir producto
        </button>
    </div>

    
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Imagen Url</th>
                    <th>Stock</th>
                    <th>Marca</th>
                    <th>Categoría</th>
                    <th style="min-width: 140px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}" class="text-truncate"></td>
                    <td th:text="${producto.name}" class="text-truncate" style="max-width: 150px;"></td>
                    <td th:text="${producto.description}" class="text-truncate" style="max-width: 200px;"></td>
                    <td th:text="${producto.precio}"></td>
                    <td>
                        <img th:src="${producto.imageUrl}" alt="Imagen" class="img-thumbnail" style="max-width: 80px;">
                    </td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${producto.marcaNombre}"></td>
                    <td th:text="${producto.categoriaNombre}"></td>
                    <td>
                        <div class="d-flex flex-wrap justify-content-center gap-2">
                            <button type="button" class="btn btn-warning btn-sm"
                                th:attr="data-bs-target='#edit-product-' + ${producto.id}" data-bs-toggle="modal">
                                Editar
                            </button>

                            <form th:action="@{'/productos/eliminar/' + ${producto.id}}" method="post" class="m-0">
                                <button class="btn btn-danger btn-sm" type="submit"
                                    onclick="return confirm('¿Seguro que quieres eliminar este producto?');">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="gest-product" tabindex="-1" aria-labelledby="gestProductLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                <form th:action="@{/productos}" method="post" th:object="${producto}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="gestProductLabel">Añadir nuevo producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Mostrar mensaje de error general -->
                        <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                            <span th:text="${mensajeError}"></span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="addProductName">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}" 
                                   id="addProductName"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="addProductDescription">Descripción</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" 
                                      id="addProductDescription"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" required></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="addProductImageUrl">URL Imagen</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}" 
                                   id="addProductImageUrl"
                                   th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="addProductStock">Stock</label>
                                <input type="number" class="form-control" th:field="*{stock}" min="0" 
                                       id="addProductStock"
                                       th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="addProductPrecio">Precio</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{precio}" min="0"
                                       id="addProductPrecio"
                                       th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" id="categoriaSelect" required>
                                <option value="" disabled selected>Seleccionar categoría</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <select class="form-select" id="marcaSelect" th:field="*{marcaId}" 
                                    th:classappend="${#fields.hasErrors('marcaId')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Primero seleccione una categoría</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('marcaId')}" th:errors="*{marcaId}"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Añadir producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Script para reabrir el modal si hay errores y manejar selección cascada -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var seccion = /*[[${seccion}]]*/ '';
            var hasErrors = /*[[${#fields.hasErrors('producto.*')}]]*/ false;
            
            console.log('Seccion:', seccion, 'Has Errors:', hasErrors);
            
            if (seccion === 'productos') {
                // Asegurar que la sección de productos esté visible
                setTimeout(function() {
                    const productosSection = document.getElementById('productos');
                    if (productosSection && productosSection.classList.contains('d-none')) {
                        const botonProductos = document.querySelector("button[onclick*=\"'productos'\"]");
                        if (botonProductos) {
                            mostrarSeccion('productos', botonProductos);
                        }
                    }
                    
                    // Si hay errores, abrir el modal
                    if (hasErrors) {
                        var modal = new bootstrap.Modal(document.getElementById('gest-product'));
                        modal.show();
                    }
                }, 100);
            }
            
            // Función para cargar marcas por categoría
            function cargarMarcasPorCategoria(categoriaId, marcaSelect, marcaIdSeleccionada) {
                if (!categoriaId) {
                    marcaSelect.innerHTML = '<option value="" disabled selected>Primero seleccione una categoría</option>';
                    marcaSelect.disabled = true;
                    return;
                }
                
                // Deshabilitar mientras se cargan las marcas
                marcaSelect.disabled = true;
                marcaSelect.innerHTML = '<option value="" disabled selected>Cargando marcas...</option>';
                
                fetch('/marcas/categoria/' + categoriaId)
                    .then(response => response.json())
                    .then(marcas => {
                        marcaSelect.innerHTML = '<option value="" disabled selected>Seleccionar marca</option>';
                        marcas.forEach(marca => {
                            const option = document.createElement('option');
                            option.value = marca.id;
                            option.textContent = marca.nombre;
                            if (marca.id == marcaIdSeleccionada) {
                                option.selected = true;
                            }
                            marcaSelect.appendChild(option);
                        });
                        // Habilitar el select después de cargar las marcas
                        marcaSelect.disabled = false;
                        
                        // Si no hay marcas, mostrar mensaje
                        if (marcas.length === 0) {
                            marcaSelect.innerHTML = '<option value="" disabled selected>No hay marcas para esta categoría</option>';
                        }
                    })
                    .catch(error => {
                        console.error('Error cargando marcas:', error);
                        marcaSelect.innerHTML = '<option value="" disabled selected>Error cargando marcas</option>';
                        marcaSelect.disabled = true;
                    });
            }
            
            // Modal de añadir producto
            const categoriaSelect = document.getElementById('categoriaSelect');
            const marcaSelect = document.getElementById('marcaSelect');
            
            if (categoriaSelect && marcaSelect) {
                categoriaSelect.addEventListener('change', function() {
                    cargarMarcasPorCategoria(this.value, marcaSelect);
                });
            }
            
            // Modales de edición - Inicializar eventos de cambio de categoría
            document.querySelectorAll('[id^="editCategoriaSelect-"]').forEach(select => {
                const productoId = select.getAttribute('data-producto-id');
                const marcaSelectEdit = document.getElementById('editMarcaSelect-' + productoId);
                
                // Evento change para cargar marcas al cambiar categoría
                select.addEventListener('change', function() {
                    if (marcaSelectEdit) {
                        cargarMarcasPorCategoria(this.value, marcaSelectEdit);
                    }
                });
            });
            
            // Cargar marcas cuando se abre un modal de edición
            document.querySelectorAll('[id^="edit-product-"]').forEach(modal => {
                modal.addEventListener('show.bs.modal', function() {
                    const productoId = this.id.replace('edit-product-', '');
                    const categoriaSelect = document.getElementById('editCategoriaSelect-' + productoId);
                    const marcaSelect = document.getElementById('editMarcaSelect-' + productoId);
                    
                    if (categoriaSelect && marcaSelect && categoriaSelect.value) {
                        const marcaActual = marcaSelect.getAttribute('data-marca-actual');
                        cargarMarcasPorCategoria(categoriaSelect.value, marcaSelect, marcaActual);
                    }
                });
            });
        });
    </script>

    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'edit-product-' + ${producto.id}" tabindex="-1"
            aria-labelledby="editProductLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                    <form th:action="@{'/productos/editar/' + ${producto.id}}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editProductLabel">Editar producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label" th:for="'editName-' + ${producto.id}">Nombre</label>
                                <input type="text" class="form-control" name="name" 
                                       th:id="'editName-' + ${producto.id}"
                                       th:value="${producto.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:for="'editDescription-' + ${producto.id}">Descripción</label>
                                <textarea class="form-control" name="description" rows="3"
                                          th:id="'editDescription-' + ${producto.id}"
                                          th:text="${producto.description}" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:for="'editImageUrl-' + ${producto.id}">URL Imagen</label>
                                <input type="url" class="form-control" name="imageUrl" 
                                       th:id="'editImageUrl-' + ${producto.id}"
                                       th:value="${producto.imageUrl}" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:for="'editStock-' + ${producto.id}">Stock</label>
                                    <input type="number" class="form-control" name="stock" 
                                           th:id="'editStock-' + ${producto.id}"
                                           th:value="${producto.stock}" min="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:for="'editPrecio-' + ${producto.id}">Precio</label>
                                    <input type="number" step="0.01" class="form-control" name="precio"
                                           th:id="'editPrecio-' + ${producto.id}"
                                           th:value="${producto.precio}" min="0" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" th:id="'editCategoriaSelect-' + ${producto.id}" 
                                        th:attr="data-producto-id=${producto.id}" required>
                                    <option value="" disabled>Seleccionar categoría</option>
                                    <option th:each="cat : ${categorias}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}"
                                            th:selected="${cat.id == producto.categoriaId}">
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Marca</label>
                                <select class="form-select" name="marcaId" 
                                        th:id="'editMarcaSelect-' + ${producto.id}"
                                        th:attr="data-marca-actual=${producto.marcaId}" required>
                                    <option value="" disabled>Seleccionar marca</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-warning">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
