<div th:fragment="gest-marca">

    <div class="mb-3">
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-marca">
            Añadir marca
        </button>
    </div>

    
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Categoría</th>
                    <th scope="col" style="min-width: 140px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="marca : ${marcas}">
                    <td th:text="${marca.id}"></td>
                    <td th:text="${marca.name}" class="text-truncate" style="max-width: 120px;"></td>
                    <td th:text="${marca.descripcion}" class="text-truncate" style="max-width: 180px;"></td>
                    <td th:text="${marca.categoria.name}" class="text-truncate" style="max-width: 120px;"></td>
                    <td>
                        <div class="d-flex justify-content-center flex-wrap gap-2">
                            <button type="button" class="btn btn-warning btn-sm"
                                th:attr="data-bs-target='#edit-marca-' + ${marca.id}" data-bs-toggle="modal">
                                Editar
                            </button>
                            <form th:action="@{'/marcas/eliminar/' + ${marca.id}}" method="post"
                                onsubmit="return confirm('¿Seguro que quieres eliminar esta marca?');">
                                <button class="btn btn-danger btn-sm" type="submit">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="gest-marca" tabindex="-1" aria-labelledby="gestMarcaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content"
                style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                <form th:action="@{/marcas}" method="post" th:object="${marca}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="gestMarcaLabel">Añadir nueva marca</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Mostrar mensaje de error general -->
                        <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                            <span th:text="${mensajeError}"></span>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}" 
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3" 
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''" required></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoriaId}" 
                                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid' : ''" required>
                                <option value="">Seleccione una categoría</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.name}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Añadir marca</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Script para reabrir el modal si hay errores -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var seccion = /*[[${seccion}]]*/ '';
            var hasErrors = /*[[${#fields.hasErrors('marca.*')}]]*/ false;
            
            console.log('Seccion:', seccion, 'Has Errors:', hasErrors);
            
            if (seccion === 'marca') {
                // Asegurar que la sección de marcas esté visible
                setTimeout(function() {
                    const marcasSection = document.getElementById('marca');
                    if (marcasSection && marcasSection.classList.contains('d-none')) {
                        const botonMarcas = document.querySelector("button[onclick*=\"'marca'\"]");
                        if (botonMarcas) {
                            mostrarSeccion('marca', botonMarcas);
                        }
                    }
                    
                    // Si hay errores, abrir el modal
                    if (hasErrors) {
                        var modal = new bootstrap.Modal(document.getElementById('gest-marca'));
                        modal.show();
                    }
                }, 100);
            }
        });
    </script>

    <div th:each="marca : ${marcas}">
        <div class="modal fade" th:id="'edit-marca-' + ${marca.id}" tabindex="-1"
            th:attr="aria-labelledby='editMarcaLabel-' + ${marca.id}" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content"
                    style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                    <form th:action="@{'/marcas/editar/' + ${marca.id}}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" th:id="'editMarcaLabel-' + ${marca.id}">Editar marca</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="name" th:value="${marca.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="descripcion" rows="3"
                                    th:text="${marca.descripcion}" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" name="categoriaId" required>
                                    <option th:each="cat : ${categorias}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}"
                                            th:selected="${cat.id == marca.categoria.id}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-warning">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
