<div th:fragment="gest-categoria">

    <div class="mb-3">
        <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-categoria">
            Añadir categoría
        </button>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Imagen</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.name}"></td>
                <td th:text="${categoria.description}"></td>
                <td th:text="${categoria.urlImage}"></td>
                <td>
                    <button type="button" class="btn btn-warning"
                        th:attr="data-bs-target='#edit-categoria-' + ${categoria.id}" data-bs-toggle="modal">
                        Editar
                    </button>

                    <form th:action="@{'/categorias/eliminar/' + ${categoria.id}}" method="post"
                        style="display:inline;">
                        <button class="btn btn-danger" type="submit"
                            onclick="return confirm('¿Seguro que quieres eliminar esta categoría?');">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="modal fade" id="gest-categoria" tabindex="-1" aria-labelledby="gestCategoriaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content"
                style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                <form th:action="@{/categorias}" method="post" th:object="${categoria}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="gestCategoriaLabel">Añadir nueva categoría</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{name}" th:id="name-create" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{description}" th:id="description-create" rows="3"
                                required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Imagen</label>
                            <input type="url" class="form-control" th:field="*{urlImage}" th:id="urlImage-create"
                                required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Añadir categoría</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:each="categoria : ${categorias}">
        <div class="modal fade" th:id="'edit-categoria-' + ${categoria.id}" tabindex="-1"
            th:attr="aria-labelledby='editCategoriaLabel-' + ${categoria.id}" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
                    <form th:action="@{'/categorias/editar/' + ${categoria.id}}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" th:id="'editCategoriaLabel-' + ${categoria.id}">Editar categoría
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="name" th:id="'name-' + ${categoria.id}"
                                    th:value="${categoria.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="description"
                                    th:id="'description-' + ${categoria.id}" rows="3" th:text="${categoria.description}"
                                    required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL Imagen</label>
                                <input type="url" class="form-control" name="urlImage"
                                    th:id="'urlImage-' + ${categoria.id}" th:value="${categoria.urlImage}" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-warning">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
