<div th:fragment="gest-usuarios">
  <div class="mb-3">
    <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-user">
      Añadir Usuario
    </button>

  </div>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo Electrónico</th>
        <th>Dirección</th>
        <th>Número de Teléfono</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.name}"></td>
        <td th:text="${usuario.lastname}"></td>
        <td th:text="${usuario.emailAddress}"></td>
        <td th:text="${usuario.address}"></td>
        <td th:text="${usuario.phoneNumber}"></td>
        <td th:text="${usuario.rol}"></td>
        <td class="table-actions">
          <button type="button" class="btn btn-warning" th:attr="data-bs-target='#edit-user-' + ${usuario.id}"
            data-bs-toggle="modal">
            Editar
          </button>
          <form th:action="@{'/admin/usuarios/eliminar/' + ${usuario.id}}" method="post" style="display:inline;">
            <input type="hidden" name="_method" value="delete" />
            <button class="btn btn-sm btn-danger" type="submit"
              onclick="return confirm('¿Seguro que quieres eliminar este usuario?');">
              Eliminar
            </button>
          </form>

        </td>
      </tr>
    </tbody>
  </table>


  <div class="modal fade" id="gest-user" tabindex="-1" aria-labelledby="gestUserLabel" aria-hidden="true"
    th:fragment="gest-usuarios">
    <div class="modal-dialog">
      <div class="modal-content"
        style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="gestUserLabel">Añadir nuevo usuario</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form th:action="@{/admin/usuarios/registrar}" method="post" th:object="${usuario}">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="Nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="Nombre" th:field="*{name}" required>
              </div>
              <div class="col-md-6">
                <label for="Apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="Apellido" th:field="*{lastname}" required>
              </div>
              <div class="col-md-6">
                <label for="Password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="Password" th:field="*{password}" required>
              </div>
              <div class="col-md-6">
                <label for="Email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="Email" th:field="*{emailAddress}" required>
              </div>
              <div class="col-md-6">
                <label for="Rol-edit" class="form-label">Rol Usuario</label>
                <select id="Rol-edit" class="form-select" th:field="*{rol}" required>
                  <option value="" disabled>Seleccionar Rol</option>
                  <option th:each="r : ${T(Pry_01.Web.de.Ventas.de.Computadoras.Model.Roles).values()}"
                    th:value="${r.name()}" th:text="${#strings.capitalize(r.name().toLowerCase())}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="Telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="Telefono" th:field="*{phoneNumber}" required>
              </div>
              <div class="col-md-6">
                <label for="Direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="Direccion" th:field="*{address}" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Añadir usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  
  <div th:each="usuario : ${usuarios}">
    <div class="modal fade" th:id="'edit-user-' + ${usuario.id}" tabindex="-1" aria-labelledby="editUserLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content"
          style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
          <div class="modal-header">
            <h1 class="modal-title fs-5">Editar usuario</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <form class="row g-3" th:action="@{'/admin/usuarios/editar/' + ${usuario.id}}" method="post">
            <div class="modal-body row g-3">
              <div class="col-md-6">
                <label for="Nombre-edit" class="form-label">Nombre</label>
                <input type="text" class="form-control" th:value="${usuario.name}" name="name" required>
              </div>
              <div class="col-md-6">
                <label for="Apellido-edit" class="form-label">Apellido</label>
                <input type="text" class="form-control" th:value="${usuario.lastname}" name="lastname" required>
              </div>
              <div class="col-md-6">
                <label for="Email-edit" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" th:value="${usuario.emailAddress}" name="emailAddress"
                  required>
              </div>
              <div class="col-md-6">
                <label for="Password-edit" class="form-label">Contraseña</label>
                <input type="password" class="form-control" th:value="${usuario.password}" name="password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Rol Usuario</label>
                <select class="form-select" name="rol" required>
                  <option value="" disabled>Seleccionar Rol</option>
                  <option th:each="r : ${T(Pry_01.Web.de.Ventas.de.Computadoras.Model.Roles).values()}"
                    th:value="${r.name()}" th:text="${#strings.capitalize(r.name().toLowerCase())}"
                    th:selected="${r.name() == usuario.rol.name()}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="Telefono-edit" class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:value="${usuario.phoneNumber}" name="phoneNumber" required>
              </div>
              <div class="col-md-6">
                <label for="Direccion-edit" class="form-label">Dirección</label>
                <input type="text" class="form-control" th:value="${usuario.address}" name="address" required>
              </div>
            </div>

            <div class="modal-footer">
              <button type="submit" class="btn btn-warning">Guardar cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
