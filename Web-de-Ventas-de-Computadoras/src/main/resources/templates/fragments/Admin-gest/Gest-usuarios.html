<div th:fragment="gest-usuarios">
  <!-- Botón para abrir modal -->
  <div class="mb-3">
    <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#gest-user">
      Añadir Usuario
    </button>

  </div>

  <!-- Tabla de usuarios -->
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo Electrónico</th>
        <th>Dirección</th>
        <th>Número de Teléfono</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.name}"></td>
        <td th:text="${usuario.lastname}"></td>
        <td th:text="${usuario.emailAddress}"></td>
        <td th:text="${usuario.address}"></td>
        <td th:text="${usuario.phoneNumber}"></td>
        <td th:text="${usuario.rol}"></td>
        <td class="table-actions">
          <button class="btn btn-sm btn-warning" th:attr="data-id=${usuario.id}, 
                           data-nombre=${usuario.name},
                           data-apellido=${usuario.lastname},
                           data-email=${usuario.emailAddress},
                           data-rol=${usuario.rol}" onclick="abrirModalEditar(this)" data-bs-toggle="modal"
            data-bs-target="#edit-user">
            Editar
          </button>

          <form th:action="@{'/usuarios/eliminar/' + ${usuario.id}}" method="post" style="display:inline;">
            <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="modal fade" id="gest-user" tabindex="-1" aria-labelledby="gestUserLabel" aria-hidden="true"
    th:fragment="gest-usuarios">
    <div class="modal-dialog">
      <div class="modal-content"
        style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="gestUserLabel">Añadir nuevo usuario</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <!-- 🚀 EL FORMULARIO -->
        <form class="row g-3" th:action="@{/usuarios}" method="post" th:object="${usuario}">
          <div class="modal-body">
            <div class="col-md-6">
              <label for="Nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="Nombre" th:field="*{name}" required>
            </div>
            <div class="col-md-6">
              <label for="Apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="Apellido" th:field="*{lastname}" required>
            </div>
            <div class="col-md-6">
              <label for="Password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="Password" th:field="*{password}" required>
            </div>

            <div class="col-md-6">
              <label for="Email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="Email" th:field="*{emailAddress}" required>
            </div>
            <div class="col-md-6">
              <label for="Rol" class="form-label">Rol Usuario</label>
              <select id="Rol" class="form-select" th:field="*{rol}" required>
                <option value="">Seleccionar Rol</option>
                <option value="CLIENTE">Cliente</option>
                <option value="DELIVERY">Delivery</option>
                <option value="ADMINISTRADOR">Administrador</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="Telefono" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="Telefono" th:field="*{phoneNumber}" required>
            </div>
            <div class="col-md-6">
              <label for="Direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="Direccion" th:field="*{address}" required>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Añadir usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- FIN Modal añadir usuario -->

  <!-- Modal editar usuario -->
  <div class="modal fade" id="edit-user" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true"
    th:fragment="gest-usuarios">
    <div class="modal-dialog">
      <div class="modal-content"
        style="padding: 25px; background-image: url(Img/form-fond.png); border: 3px solid #e3e3e3;">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editUserLabel">Editar usuario</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form class="row g-3">
            <div class="col-md-6">
              <label for="iduser-edit" class="form-label">ID Usuario</label>
              <input type="number" class="form-control" id="iduser-edit" required>
            </div>
            <div class="col-md-6">
              <label for="Nombre-edit" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="Nombre-edit" required>
            </div>
            <div class="col-md-6">
              <label for="Apellido-edit" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="Apellido-edit" required>
            </div>
            <div class="col-md-6">
              <label for="Email-edit" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="Email-edit" required>
            </div>
            <div class="col-md-6">
              <label for="Contraseña-edit" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="Contraseña-edit" required>
            </div>
            <div class="col-md-6">
              <label for="Rol-edit" class="form-label">Rol Usuario</label>
              <select id="Rol-edit" class="form-select" required>
                <option selected>Seleccionar Rol</option>
                <option value="1">Cliente</option>
                <option value="2">Empleado</option>
                <option value="3">Administrador</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="Telefono-edit" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="Telefono-edit" placeholder="Ingrese su número telefónico"
                required>
            </div>
            <div class="col-md-6">
              <label for="Direccion-edit" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="Direccion-edit" placeholder="Av. Grau 123" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-warning">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>
