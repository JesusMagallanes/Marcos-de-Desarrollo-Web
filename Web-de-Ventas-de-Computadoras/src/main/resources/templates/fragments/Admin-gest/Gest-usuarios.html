<div th:fragment="gest-usuarios">
  <!-- Botón para abrir modal -->
  <div class="mb-3">
    <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#modalAgregarUsuario">
      Añadir Usuario
    </button>
  </div>

  <!-- Tabla de usuarios -->
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo Electrónico</th>
        <th>Dirección</th>
        <th>Número de Teléfono</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.name}"></td>
        <td th:text="${usuario.lastname}"></td>
        <td th:text="${usuario.emailAddress}"></td>
        <td th:text="${usuario.address}"></td>
        <td th:text="${usuario.phoneNumber}"></td>
        <td th:text="${usuario.rol}"></td>
        <td class="table-actions">
          <button class="btn btn-sm btn-warning"
                  th:attr="data-id=${usuario.id}, 
                           data-nombre=${usuario.name},
                           data-apellido=${usuario.lastname},
                           data-email=${usuario.emailAddress},
                           data-rol=${usuario.rol}"
                  onclick="abrirModalEditar(this)"
                  data-bs-toggle="modal"
                  data-bs-target="#modalEditarUsuario">
            Editar
          </button>

          <form th:action="@{'/usuarios/eliminar/' + ${usuario.id}}" method="post" style="display:inline;">
            <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal Añadir Usuario -->
  <div class="modal fade" id="modalAgregarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form th:action="@{/usuarios/nuevo}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Añadir Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <!-- Nombre -->
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <!-- Apellido -->
            <div class="mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" name="lastname" class="form-control" required>
            </div>
            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" name="emailAddress" class="form-control" required>
            </div>
            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <!-- Teléfono -->
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="text" name="phoneNumber" class="form-control" required>
            </div>
            <!-- Dirección -->
            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" name="address" class="form-control" required>
            </div>
            <!-- Rol -->
            <div class="mb-3">
              <label class="form-label">Rol</label>
              <select name="rol" class="form-select" required>
                <option value="">Seleccione un rol</option>
                <option value="ADMIN">ADMIN</option>
                <option value="CLIENTE">CLIENTE</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Editar Usuario -->
  <div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form th:action="@{/usuarios/editar}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Editar Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" id="edit-id">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" name="name" id="edit-nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" name="lastname" id="edit-apellido" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" name="emailAddress" id="edit-email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Rol</label>
              <select name="rol" id="edit-rol" class="form-select" required>
                <option value="ADMIN">ADMIN</option>
                <option value="CLIENTE">CLIENTE</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success">Actualizar Usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
