<div th:fragment="cuentaFragment">
    <h3>Mi cuenta</h3>
    <p>Aquí puedes ver y gestionar la información de tu cuenta.</p>

    <form th:action="@{'/usuarios/perfil/editar/' + ${usuario.id}}" method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:value="${usuario.name}" name="name" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" th:value="${usuario.lastname}" name="lastname" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" th:value="${usuario.emailAddress}" name="emailAddress" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:value="${usuario.phoneNumber}" name="phoneNumber" required>
            </div>
        </div>

        <div class="row g-3 mt-2">
            <div class="col-12">
                <label class="form-label">Dirección (Selecciona en el mapa)</label>
                <input type="text" 
                       class="form-control" 
                       th:value="${usuario.address}" 
                       name="address" 
                       id="direccionInput" 
                       readonly 
                       required>
            </div>
            <div class="col-12 mt-3">
                <div id="map" style="height: 400px; width: 100%;"></div>
            </div>
        </div>
        <br>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
    </form>
</div>
