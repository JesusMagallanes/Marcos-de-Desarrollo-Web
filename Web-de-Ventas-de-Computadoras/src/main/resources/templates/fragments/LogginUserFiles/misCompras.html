<div th:fragment="comprasFragment">
    <div class="container my-4">
        <h3 class="mb-4">
            <i class="fa fa-shopping-bag me-2"></i>Mis Compras
        </h3>
        
        <div id="pedidos-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3 text-muted">Cargando tus pedidos...</p>
        </div>

        <div id="pedidos-container" class="d-none">
            <!-- Los pedidos se cargarán dinámicamente aquí -->
        </div>

        <div id="pedidos-empty" class="d-none text-center py-5">
            <i class="fa fa-shopping-basket text-muted" style="font-size: 4rem;"></i>
            <h5 class="mt-3 text-muted">No tienes compras registradas</h5>
            <p class="text-muted">Cuando realices una compra, aparecerá aquí.</p>
            <a href="/Index" class="btn btn-primary mt-3">
                <i class="fa fa-shopping-cart me-2"></i>Ir a Comprar
            </a>
        </div>

        <div id="pedidos-error" class="d-none alert alert-danger">
            <i class="fa fa-exclamation-triangle me-2"></i>
            Error al cargar los pedidos. Por favor, intenta de nuevo más tarde.
        </div>
    </div>
</div>
