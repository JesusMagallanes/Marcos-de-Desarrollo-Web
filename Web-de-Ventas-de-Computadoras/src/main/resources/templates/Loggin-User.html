<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SmartZone</title>
    <link rel="stylesheet" href="/css/Style.css">
    <link rel="icon" href="/Img/img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/Chat-Bot.css">
</head>


<body class="d-flex flex-column h-100">

    <div th:replace="fragments/headerFooter/header :: header(productos=${productos})"></div>
    <div th:replace="fragments/Categoria :: categoria"></div>
    <div th:replace="fragments/Login-Register/Login :: login"></div>
    <div th:replace="fragments/Login-Register/Register :: register"></div>
    <div th:replace="fragments/CarritoModal/carritoModal :: carritoModalFragment"></div>

    


    <div class="container mt-0">
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <main>
        <div class="container-fluid py-4">
            <div class="row justify-content-center">
                <!-- Sidebar -->
                <div class="col-12 col-md-3 mb-3">
                <div class="sidebar p-3">
                    <h6 class="fw-semibold border-bottom pb-2 mb-3">Bienvenido</h6>
                    <p class="small text-muted mb-3">usuario@gmail.com</p>

                    <a href="#" class="menu-link active" data-fragment="fragments/LogginUserFiles/cuenta :: cuentaFragment">
                    <i class="bi bi-person me-2"></i> Mi cuenta
                    </a>

                    <a href="#" class="menu-link" data-fragment="fragments/LogginUserFiles/misCompras :: comprasFragment">
                    <i class="bi bi-bag me-2"></i> Mis compras
                    </a>

                    <a href="#" class="menu-link" data-fragment="fragments/LogginUserFiles/historial :: historialFragment">
                    <i class="bi bi-clock-history me-2"></i> Historial
                    </a>

                    <a href="#" class="menu-link" data-fragment="fragments/LogginUserFiles/favoritos :: favoritosFragment">
                    <i class="bi bi-heart me-2"></i> Favoritos y listas
                    </a>

                    <hr>

                    <a href="#" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión</a>
                </div>
                </div>

                <!-- Contenedor de contenido dinámico -->
                <div class="col-12 col-md-7" id="contenido-dinamico">
                <div th:replace="fragments/LogginUserFiles/cuenta :: cuentaFragment"></div>
                </div>

            </div>
        </div>

    
    </main>

    <div th:replace="fragments/headerFooter/footer :: footer"></div>
    <!--CONTENIDO BOT-->
    <div id="chatbot-container">
        <div id="chat-header">
            <div class="brand">
                <div class="logo">SZ</div>
                <div>SmartZoneBot</div>
            </div>
            <div id="close-chat">✕</div>
        </div>
        <div id="chat-body"></div>
        <div id="chat-footer">
            <input id="user-input" type="text" placeholder="Escribe tu consulta...">
            <button id="send-btn">➤</button>
        </div>
    </div>
    <button id="chat-toggle"><img src="Img/logo-bot.svg" class="card-img-top" width="10" height="30" alt="Bot"></button>
    <!--FIN CONTENIDO BOT-->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/Chat-Bot.js"></script>
    <script src="Js/Loggin-user.js"></script>
    <script src="Js/carritoOffcanvas.js"></script>
</body>

</html>
