<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Style.css">
    <link rel="icon" href="/Img/img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/Css/Chat-Bot.css">
    <title>SmartZone</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="fragments/headerFooter/header :: header(productos=${productos})"></div>
    <div th:replace="fragments/Categoria :: categoria"></div>
    <div th:replace="fragments/Login-Register/Login :: login"></div>
    <div th:replace="fragments/Login-Register/Register :: register"></div>
    <div th:replace="fragments/CarritoModal/carritoModal :: carritoModalFragment"></div>


    <main>
        <div class="container my-4">
            <div class="row">
                <!-- Carrito -->
                <div class="col-md-8">
                    <div class="card mb-3" style="height: 400px ;overflow-y: auto;">
                        <div class="card-body">

                            <!-- Texto encima del producto -->
                            <small class="text-muted">Productos del
                                <span class="text-success fw-bold">Carrito</span>
                            </small>
                            <hr>

                            <!-- Contenedor que renderiza el carrito mediante JS (misma lógica que el offcanvas) -->
                            <div id="carrito-page-contenido">
                                <p class="text-center">Cargando carrito...</p>
                            </div>
                            <!-- Depuración removida: si sigue ocurriendo ERR_INCOMPLETE_CHUNKED_ENCODING,
                                 revisa logs del servidor y ejecuta fetch('/carrito/items') en la consola. -->
                        </div>
                    </div>
                </div>

                <!-- Resumen de la orden -->
                <div class="col-md-4">
                    <div class="card p-3">
                        <h6 class="fw-bold mb-3">Resumen de la orden</h6>

                        <div class="d-flex justify-content-between">
                            <span>Productos (<span id="carrito-page-count">0</span>)</span>
                            <span id="carrito-page-total">S/ 0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold">
                            <span>Total:</span>
                            <span class="text-primary" id="carrito-page-total-strong">S/ 0.00</span>
                        </div>

                        <button class="btn btn-dark w-100 rounded-pill mt-3">Continuar compra</button>
                    </div>

                    <div class="alert alert-light text-center mt-3 border">
                        <strong>¡Ahora puedes pagar con Yape!</strong>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script>
        (function(){
            const pageContainer = document.getElementById('carrito-page-contenido');
            const countEl = document.getElementById('carrito-page-count');
            const totalEl = document.getElementById('carrito-page-total');
            const totalStrong = document.getElementById('carrito-page-total-strong');

            function getCsrf() {
                const tokenMeta = document.querySelector('meta[name="_csrf"]');
                const headerMeta = document.querySelector('meta[name="_csrf_header"]');
                return {
                    token: tokenMeta ? tokenMeta.getAttribute('content') : null,
                    header: headerMeta ? headerMeta.getAttribute('content') : 'X-CSRF-TOKEN'
                };
            }

            function renderItems(json) {
                const items = (json && json.items) ? json.items : [];
                if (!items || items.length === 0) {
                    pageContainer.innerHTML = '<p class="text-center">Tu carrito está vacío.</p>';
                    countEl.textContent = 0;
                    totalEl.textContent = 'S/ 0.00';
                    totalStrong.textContent = 'S/ 0.00';
                    return;
                }

                const html = items.map(item => {
                    const price = Number(item.precio || 0).toFixed(2);
                    return `
                        <div class="row align-items-center mb-2">
                            <div class="col-2 text-center">
                                <img src="${item.image || '/Img/img.png'}" class="img-fluid" style="max-height:80px; object-fit:contain;" alt="Producto">
                            </div>
                            <div class="col-6">
                                <h6 class="mb-1 fw-bold">${item.nombre}</h6>
                                <p class="mb-1 text-muted">${item.nombre}</p>
                            </div>
                                        <div class="col-4 text-end">
                                            <h5 class="fw-bold text-danger mb-1">S/ ${price}</h5>
                                            <div class="d-flex justify-content-end align-items-center mt-2">
                                                <button data-product-id="${item.productId}" class="btn btn-sm btn-outline-secondary btn-decrease">-</button>
                                                <input type="text" value="${item.cantidad}" class="form-control form-control-sm text-center mx-2" style="width:50px;" readonly>
                                                <button data-product-id="${item.productId}" class="btn btn-sm btn-outline-secondary btn-add">+</button>
                                                <button data-item-id="${item.itemId}" class="btn btn-sm btn-outline-danger ms-2 btn-delete" title="Eliminar item"><i class="fa fa-trash"></i></button>
                                            </div>
                                        </div>
                        </div>
                        <hr>
                    `;
                }).join('\n');

                pageContainer.innerHTML = html;
                countEl.textContent = items.length;
                totalEl.textContent = 'S/ ' + (json.subtotal || 0).toFixed(2);
                totalStrong.textContent = 'S/ ' + (json.subtotal || 0).toFixed(2);

                // attach handlers
                document.querySelectorAll('.btn-add').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const productId = btn.dataset.productId;
                        addAjax(productId, 1);
                    });
                });

                // disminuir cantidad (usa addAjax con cantidad negativa)
                document.querySelectorAll('.btn-decrease').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const productId = btn.dataset.productId;
                        // intentar reducir 1 unidad; el backend debe soportar cantidades negativas como decremento
                        addAjax(productId, -1);
                    });
                });

                // eliminar item por completo
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const itemId = btn.dataset.itemId;
                        if (!confirm('¿Eliminar este producto del carrito?')) return;
                        removeAjax(itemId);
                    });
                });
            }

            function loadPageCart() {
                fetch('/carrito/items', { credentials: 'same-origin' })
                    .then(r => {
                        if (r.status === 401) {
                            pageContainer.innerHTML = '<p class="text-center">Debes iniciar sesión para ver el carrito.</p>';
                            return null;
                        }
                        return r.json();
                    })
                    .then(json => {
                        if (json) renderItems(json);
                    }).catch(err => {
                        console.error('Error cargando carrito:', err);
                        pageContainer.innerHTML = '<p class="text-center text-danger">Error cargando carrito.</p>';
                    });
            }

            function addAjax(productId, cantidad) {
                const csrf = getCsrf();
                fetch('/carrito/addAjax/' + encodeURIComponent(productId), {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, csrf.token ? { [csrf.header]: csrf.token } : {}),
                    body: JSON.stringify({ cantidad: cantidad })
                }).then(r => {
                    if (!r.ok) throw new Error('No autorizado');
                    return r.json().catch(() => ({ ok: true }));
                }).then(() => {
                    loadPageCart();
                }).catch(err => {
                    console.error('Error addAjax:', err);
                    if (err.message && err.message.includes('No autorizado')) {
                        window.location.href = '/usuarios/Loggin-User';
                    }
                });
            }

            function removeAjax(itemId) {
                        const csrf = getCsrf();
                        fetch('/carrito/removeAjax/' + encodeURIComponent(itemId), {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: csrf.token ? { [csrf.header]: csrf.token } : {}
                        }).then(r => {
                            if (!r.ok) throw new Error('No autorizado');
                            return r.json().catch(() => ({ ok: true }));
                        }).then(() => {
                            loadPageCart();
                        }).catch(err => {
                            console.error('Error removeAjax:', err);
                        });
                    }

            // inicializar
            document.addEventListener('DOMContentLoaded', loadPageCart);
        })();
    </script>
    <div th:replace="fragments/headerFooter/footer :: footer"></div>

    <!--CONTENIDO BOT-->
    <div id="chatbot-container">
        <div id="chat-header">
            <div class="brand">
                <div class="logo">SZ</div>
                <div>SmartZoneBot</div>
            </div>
            <div id="close-chat">✕</div>
        </div>
        <div id="chat-body"></div>
        <div id="chat-footer">
            <input id="user-input" type="text" placeholder="Escribe tu consulta...">
            <button id="send-btn">➤</button>
        </div>
    </div>
    <button id="chat-toggle"><img src="Img/logo-bot.svg" class="card-img-top" width="10" height="30" alt="Bot"></button>
</body>

</html>
