<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="500.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Error 500</title>
</head>

<body>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="error-card text-center">
            <img src="img/logo.png" width="35%" alt="Logo"><br><br>
            <h2 class="error-tittle">ERROR (500)</h2><br>
            <h3 class="error-message">¡Ups! Algo salió mal en el servidor.</h3>
            <p class="error-details">
                Ha ocurrido un error inesperado. Estamos trabajando para solucionarlo.
            </p>
            <p class="text-muted small mb-4">
                Código del error: <span id="errorCode"></span>
            </p>

            <a href="/" class="btn btn-danger btn-custom">Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('errorCode').textContent =
            Math.random().toString(36).substring(2, 12).toUpperCase();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
