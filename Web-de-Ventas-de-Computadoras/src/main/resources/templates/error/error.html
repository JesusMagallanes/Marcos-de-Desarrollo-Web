<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/500.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title th:text="'Error ' + ${code}">Error</title>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="error-card text-center p-5 rounded">
            <img src="/Img/logo.png" width="35%" alt="Logo" class="mb-4">
            
            <h2 class="error-title" th:text="'ERROR (' + ${code} + ')'">ERROR (500)</h2>
            <h3 class="error-message" th:text="${message}">Ha ocurrido un error inesperado.</h3>
            
            <p class="text-muted small mb-4">
                Código interno: <span id="errorCode"></span>
            </p>

            <a th:href="@{/}" class="btn btn-danger btn-custom">Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('errorCode').textContent =
            Math.random().toString(36).substring(2, 10).toUpperCase();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
