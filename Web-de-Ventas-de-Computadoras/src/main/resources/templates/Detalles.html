<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SmartZone</title>
    <link rel="stylesheet" href="/css/Style.css">
    <link rel="icon" href="/Img/img.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/css/Chat-Bot.css">
</head>

<body class="d-flex flex-column h-100">
    <div th:replace="~{fragments/headerFooter/header :: header}"></div>
    <div th:replace="fragments/Categoria :: categoria"></div>
    <div th:replace="fragments/Login-Register/Login :: login"></div>
    <div th:replace="fragments/Login-Register/Register :: register"></div>

    <main class="flex-shrink-0" style="margin: 30px;">
        <div id="product-root" class="container text-center"
            style="background-color: white; padding: 10px; border-radius: 10px; box-shadow: 0px 0px 7px rgba(0, 0, 0, 0.179)">
            <!-- Aquí se inyecta todo el contenido dinámico -->
        </div>
        <div id="payments-placeholder" style="display:none;">
            <div class="container text-center mt-4">
                <div class="row justify-content-center">
                    <div class="col-4 col-md-2">
                        <img src="https://logosenvector.com/logo/img/yape-bolivia-37328.png"
                            width="60px" class="img-fluid rounded" alt="yape">
                    </div>
                    <div class="col-4 col-md-2">
                        <img src="https://img.icons8.com/?size=512&id=13608&format=png" width="60px"
                            class="img-fluid rounded" alt="visa">
                    </div>
                    <div class="col-4 col-md-2">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/88/MasterCard_early_1990s_logo.svg"
                            width="60px" style="margin-top: 15px;" class="img-fluid rounded" alt="mastercard">
                    </div>
                    <div class="col-4 col-md-2">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaft1EtwutCeXGzg0hfXfXubaH1jXMJeb-Rg&s"
                            width="60px" class="img-fluid rounded" alt="paypal">
                    </div>
                </div>
            </div>
        </div>
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <img src="Img/img.png" class="rounded me-2" height="20px" alt="SmartZone">
                    <strong class="me-auto">Notificación Carrito</strong>
                    <small class="text-muted" id="toastTime">ahora</small>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body" id="toastMessage">
                    <!-- aquí se pondrá el mensaje -->
                </div>
            </div>
        </div>
    </main>
    <div th:replace="fragments/headerFooter/footer :: footer"></div>

    <!--CONTENIDO BOT-->
    <div id="chatbot-container">
        <div id="chat-header">
            <div class="brand">
                <div class="logo">SZ</div>
                <div>SmartZoneBot</div>
            </div>
            <div id="close-chat">✕</div>
        </div>
        <div id="chat-body"></div>
        <div id="chat-footer">
            <input id="user-input" type="text" placeholder="Escribe tu consulta...">
            <button id="send-btn">➤</button>
        </div>
    </div>
    <button id="chat-toggle"><img src="Img/logo-bot.svg" class="card-img-top" width="10" height="30" alt="Bot"></button>
    <!--FIN CONTENIDO BOT-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/Chat-Bot.js"></script>
    <script src="Js/Productos-Det.js"></script>
</body>

</html>
