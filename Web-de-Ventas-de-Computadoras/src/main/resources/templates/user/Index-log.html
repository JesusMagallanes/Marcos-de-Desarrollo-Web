<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Index - Usuario</title>
</head>
<body>
  <div th:if="${usuario == null}">
    <h1>Bienvenido, Invitado</h1>
  </div>

  <div th:if="${usuario != null}">
    <h1 th:text="${usuario.name != null ? usuario.name : 'Usuario'}">Bienvenido</h1>
    <p>Apellido: <span th:text="${usuario.lastname}"></span></p>
    <p>Email: <span th:text="${usuario.emailAddress}"></span></p>
  </div>
  
  <p>Has iniciado sesión correctamente.</p>
  <a th:href="@{/usuarios/logout}">Cerrar sesión</a>
  <a th:href="@{/}">Ir al inicio público</a>
</body>
</html>
