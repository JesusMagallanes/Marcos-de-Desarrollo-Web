<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartZone</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="/Css/Style.css">
    
    <!-- Favicon -->
    <link rel="icon" href="/Img/img.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

        <link rel="stylesheet" href="/Css/Chat-Bot.css">
</head>
<body th:fragment="enviosPag">

    <!-- HEADER -->
    <div th:replace="fragments/headerFooter/header :: header"></div>

    <!-- CATEGORÍA -->
    <div th:replace="fragments/Categoria :: categoria"></div>

    <!-- LOGIN & REGISTER -->
    <div th:replace="fragments/Login-Register/Login :: login"></div>
    <div th:replace="fragments/Login-Register/Register :: register"></div>

    <!-- CARRITO MODAL -->
    <div th:replace="fragments/CarritoModal/carritoModal :: carritoModalFragment"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-shrink-0 my-4">
        <div class="container">
            <h3 class="mb-4">Gestionar envíos</h3>
            <div class="enviospend">
                <h4 class="mb-3">Envíos pendientes</h4>

                <!-- TARJETA DE PRODUCTO -->
                <div class="card no-hover mb-3" th:each="i : ${#numbers.sequence(1,3)}">
                    <div class="row g-0 align-items-center">

                        <!-- Producto -->
                        <div class="col-md-4 d-flex align-items-center p-3">
                            <img src="https://media.falabella.com/falabellaPE/143189901_01/w=1500,h=1500,fit=pad"
                                 class="img-fluid me-3" style="max-width: 100px;" alt="asus">
                            <div>
                                <h6 class="fw-bold">Laptop Asus Tuf F15 Gaming FX507VV-LP142</h6>
                                <small class="text-muted">Av. Javier Prado Este 1234, San Borja, Lima, Perú</small>
                            </div>
                        </div>

                        <!-- Fecha -->
                        <div class="col-md-4 p-3 d-flex justify-content-center">
                            <form>
                                <h6 class="fw-bold mb-2">Programar Fecha:</h6>
                                <div class="input-group">
                                    <input type="date" class="form-control fecha" name="fecha">
                                    <button class="btn btn-primary" type="submit">Subir</button>
                                </div>
                            </form>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-4 p-3 d-flex justify-content-center">
                            <div class="dropdown">
                                <h6 class="fw-bold mb-2">Establecer Estado:</h6>
                                <button class="btn btn-secondary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown" data-bs-display="static">
                                    Estado: Pendiente
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#">Pendiente</a></li>
                                    <li><a class="dropdown-item" href="#">En camino</a></li>
                                    <li><a class="dropdown-item" href="#">Entregado</a></li>
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="fragments/headerFooter/footer :: footer"></div>

    <!-- CHATBOT -->
    <div id="chatbot-container">
        <div id="chat-header">
            <div class="brand">
                <div class="logo">SZ</div>
                <div>SmartZoneBot</div>
            </div>
            <div id="close-chat">✕</div>
        </div>
        <div id="chat-body"></div>
        <div id="chat-footer">
            <input id="user-input" type="text" placeholder="Escribe tu consulta...">
            <button id="send-btn">➤</button>
        </div>
    </div>
    <button id="chat-toggle">
        <img src="/Img/logo-bot.svg" class="card-img-top" width="30" height="30" alt="Bot">
    </button>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Js/Chat-Bot.js"></script>
    <script src="/Js/Productos-Det.js"></script>

</body>
</html>
