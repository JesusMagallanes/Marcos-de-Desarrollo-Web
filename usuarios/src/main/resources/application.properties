spring.application.name=usuarios
server.port=8082

# ── Origen de la configuracion sensible ─────────────────────────
# Lee el .env de la raiz del repositorio (y uno local si existe).
# `optional:` = si falta, el servicio arranca igual.
# Las variables de entorno del sistema TIENEN PRIORIDAD sobre estos
# archivos: en produccion se inyectan sin tocar nada del codigo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]


# ── Base de datos ───────────────────────────────────────────────
# Credenciales por variable de entorno. Las del monolito estan en el historial
# de git y deben considerarse comprometidas: rota la contrasena en Neon.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cada servicio es dueno de su esquema. Nadie escribe en el de otro.
spring.jpa.properties.hibernate.default_schema=usuarios
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# El esquema lo construye Flyway, no Hibernate: cuatro servicios con
# ddl-auto=update sobre la misma base es una carrera de migraciones.
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# -- Credenciales de migracion (RLS) ------------------------------
# Flyway migra con el rol DUENO de las tablas; la aplicacion se conecta con un
# rol SIN BYPASSRLS para que las politicas de Row Level Security surtan efecto.
# Postgres ignora RLS por completo para superusuarios y roles con BYPASSRLS, y
# lo hace en silencio, asi que la app nunca debe usar el rol dueno.
#
# Efecto secundario buscado: al fijar spring.flyway.user, Flyway construye su
# propio DataSource y no pasa por el envoltorio DataSourceRls, de modo que las
# migraciones corren sin contexto de usuario y sin chocar con las politicas.
spring.flyway.user=${DB_MIGRACION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRACION_PASSWORD:${DB_PASSWORD}}

# ── JWT ─────────────────────────────────────────────────────────
# El MISMO secreto debe estar en los 4 servicios. Minimo 32 bytes para HS256;
# el arranque falla si es mas corto o si tiene un valor de ejemplo.
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=smartzone-usuarios
seguridad.jwt.audiencia=smartzone-api
seguridad.jwt.expiracion-cliente=3600000
seguridad.jwt.expiracion-empleado=7200000
seguridad.jwt.expiracion-administrador=1800000
seguridad.jwt.expiracion-refresh=604800000

# -- CORS (A05) ---------------------------------------------------
# Lista blanca de origenes que pueden llamar a la API desde un navegador.
# En produccion se define CORS_ORIGENES con el dominio real; el valor por
# defecto solo cubre el desarrollo local (Angular en :4200 y el gateway).
# No admite comodines: el arranque falla si se cuela un '*'.
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Proxies cuyo X-Forwarded-For nos creemos. Fuera de esta lista la cabecera se
# ignora y se usa la IP del socket: si no, cualquiera se salta el rate limit
# mandando una cabecera distinta en cada peticion.
seguridad.proxies-de-confianza=${PROXIES_DE_CONFIANZA:127.0.0.1,::1,10.,172.,192.168.}

# ── Endurecimiento (OWASP A05) ──────────────────────────────────
# Actuator: solo health, y sin desglose de componentes internos.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.aplicacion=usuarios
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# No revelar el servidor ni la traza en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=256KB

# Limita el tamano del cuerpo: evita agotar memoria con peticiones enormes.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Cierre ordenado: no se cortan peticiones en vuelo al desplegar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Pool de conexiones acotado; sin esto un pico agota la base compartida.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

# ── Administrador inicial ───────────────────────────────────────
# Solo se crea si no existe. Sin ADMIN_PASSWORD no se siembra nada.
admin.seed.email=${ADMIN_EMAIL:admin@smartzone.com}
admin.seed.password=${ADMIN_PASSWORD:}

# ── OAuth2: Google y Facebook ───────────────────────────────────
# A donde se devuelve el navegador con el token ya emitido.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# El callback apunta al GATEWAY, no a este servicio: es la URL que se registra
# en Google Cloud Console y en Facebook Developers.
app.oauth-redirect-base=${OAUTH_REDIRECT_BASE:http://localhost:8080}

# Necesario para que Spring construya bien las URLs detras del gateway.
server.forward-headers-strategy=framework

# Las credenciales de Google y Facebook salen del .env (GOOGLE_CLIENT_ID,
# FACEBOOK_CLIENT_ID...). NO se declaran aqui como propiedades de Spring
# porque un client-id vacio hace fallar el arranque; en su lugar
# ProveedoresOAuthConfig registra solo los proveedores que tengan credenciales.
seguridad.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
seguridad.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
seguridad.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
seguridad.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}

logging.level.com.backend.usuarios=INFO
