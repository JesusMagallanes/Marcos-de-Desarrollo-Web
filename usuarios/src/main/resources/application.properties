spring.application.name=usuarios
server.port=8082

# ── Origen de la configuracion sensible ─────────────────────────
# Lee el .env de la raiz del repositorio (y uno local si existe).
# `optional:` = si falta, el servicio arranca igual.
# Las variables de entorno del sistema TIENEN PRIORIDAD sobre estos
# archivos: en produccion se inyectan sin tocar nada del codigo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]


# ── Base de datos ───────────────────────────────────────────────
# Credenciales por variable de entorno. Las del monolito estan en el historial
# de git y deben considerarse comprometidas: rota la contrasena en Neon.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cada servicio es dueno de su esquema. Nadie escribe en el de otro.
spring.jpa.properties.hibernate.default_schema=usuarios
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# El esquema lo construye Flyway, no Hibernate: cuatro servicios con
# ddl-auto=update sobre la misma base es una carrera de migraciones.
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# -- Credenciales de migracion (RLS) ------------------------------
# Flyway migra con el rol DUENO de las tablas; la aplicacion se conecta con un
# rol SIN BYPASSRLS para que las politicas de Row Level Security surtan efecto.
# Postgres ignora RLS por completo para superusuarios y roles con BYPASSRLS, y
# lo hace en silencio, asi que la app nunca debe usar el rol dueno.
#
# Efecto secundario buscado: al fijar spring.flyway.user, Flyway construye su
# propio DataSource y no pasa por el envoltorio DataSourceRls, de modo que las
# migraciones corren sin contexto de usuario y sin chocar con las politicas.
spring.flyway.user=${DB_MIGRACION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRACION_PASSWORD:${DB_PASSWORD}}

# ── JWT ─────────────────────────────────────────────────────────
# El MISMO secreto debe estar en los 4 servicios. Minimo 32 bytes para HS256;
# el arranque falla si es mas corto o si tiene un valor de ejemplo.
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=smartzone-usuarios
seguridad.jwt.audiencia=smartzone-api
seguridad.jwt.expiracion-cliente=3600000
# Misma duracion que el cliente: el colaborador solo gestiona sus propios
# productos y todo pasa por moderacion antes de publicarse.
seguridad.jwt.expiracion-empleado=7200000
seguridad.jwt.expiracion-administrador=1800000
seguridad.jwt.expiracion-refresh=604800000

# -- CORS (A05) ---------------------------------------------------
# Lista blanca de origenes que pueden llamar a la API desde un navegador.
# En produccion se define CORS_ORIGENES con el dominio real; el valor por
# defecto solo cubre el desarrollo local (Angular en :4200 y el gateway).
# No admite comodines: el arranque falla si se cuela un '*'.
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Proxies cuyo X-Forwarded-For nos creemos. Fuera de esta lista la cabecera se
# ignora y se usa la IP del socket: si no, cualquiera se salta el rate limit
# mandando una cabecera distinta en cada peticion.
seguridad.proxies-de-confianza=${PROXIES_DE_CONFIANZA:127.0.0.1,::1,10.,172.,192.168.}

# ── Endurecimiento (OWASP A05) ──────────────────────────────────
# Actuator: solo health, y sin desglose de componentes internos.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.aplicacion=usuarios
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# No revelar el servidor ni la traza en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=256KB

# Limita el tamano del cuerpo: evita agotar memoria con peticiones enormes.
#
# 5MB y no los 2MB de antes porque ahora SI hay subida de ficheros: los
# documentos de identidad. Una foto de un DNI hecha con un movil actual pasa
# de 2MB con facilidad. Tiene que coincidir con AlmacenDocumentos.TAMANO_MAXIMO:
# si Spring cortara antes, el usuario recibiria un error que habla de un limite
# distinto del que de verdad se le aplica.
spring.servlet.multipart.max-file-size=5MB
# Un poco mas que el fichero, para el resto del formulario multipart.
spring.servlet.multipart.max-request-size=6MB

# ── Documentos de identidad de los colaboradores ──
# Carpeta dentro del contenedor. Es un volumen que NO sirve la web: estos
# ficheros solo salen por el endpoint que comprueba quien pregunta.
smartzone.documentos.ruta=/datos/identidad
# Retencion: los subidos y nunca enviados se borran pronto; los de solicitudes
# ya resueltas aguantan por si hay que revisar una decision o una reclamacion.
smartzone.documentos.dias-huerfanos=7
smartzone.documentos.dias-resueltas=90
smartzone.documentos.cron-purga=0 30 3 * * *

# Version vigente de los terminos para vender. Se compara con la que dice el
# cliente haber enseniado: si no coincide, acepto un texto que ya no esta.
smartzone.colaboradores.terminos-version=2026-08

# Cierre ordenado: no se cortan peticiones en vuelo al desplegar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Pool de conexiones acotado; sin esto un pico agota la base compartida.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

# ── Administrador inicial ───────────────────────────────────────
# Solo se crea si no existe. Sin ADMIN_PASSWORD no se siembra nada.
admin.seed.email=${ADMIN_EMAIL:admin@smartzone.com}
admin.seed.password=${ADMIN_PASSWORD:}

# ── OAuth2: Google y Facebook ───────────────────────────────────
# A donde se devuelve el navegador con el token ya emitido.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# El callback apunta al GATEWAY, no a este servicio: es la URL que se registra
# en Google Cloud Console y en Facebook Developers.
app.oauth-redirect-base=${OAUTH_REDIRECT_BASE:http://localhost:8080}

# Necesario para que Spring construya bien las URLs detras del gateway.
server.forward-headers-strategy=framework

# Las credenciales de Google y Facebook salen del .env (GOOGLE_CLIENT_ID,
# FACEBOOK_CLIENT_ID...). NO se declaran aqui como propiedades de Spring
# porque un client-id vacio hace fallar el arranque; en su lugar
# ProveedoresOAuthConfig registra solo los proveedores que tengan credenciales.
seguridad.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
seguridad.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
seguridad.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
seguridad.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}

logging.level.com.backend.usuarios=INFO

# ── Avisos por correo ────────────────────────────────────────────
# Se usa para decirle al solicitante que su peticion para vender fue aprobada o
# rechazada. ES OPCIONAL: sin MAIL_USERNAME el servicio arranca igual y los
# avisos se escriben en el log en vez de enviarse, que en desarrollo es lo que
# se quiere.
#
# Para Gmail hace falta una CONTRASENA DE APLICACION, no la del correo:
#   1. Activa la verificacion en dos pasos en la cuenta de Google.
#   2. Entra en https://myaccount.google.com/apppasswords
#   3. Genera una para "Correo" y pegala en MAIL_PASSWORD del .env (16
#      caracteres, sin espacios).
# La contrasena normal no funciona: Google la rechaza desde 2022.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin estos dos, un servidor de correo lento cuelga el hilo indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# El starter de correo aniade un indicador de salud que intenta CONECTAR con el
# servidor SMTP. Sin credenciales configuradas eso falla, y arrastra el
# /actuator/health entero a DOWN: Docker no marca sano el contenedor y la pila no
# levanta. Se descubrio arrancandola, no compilando.
#
# Se desactiva porque contradice el diseno: los avisos fallan en silencio a
# proposito para no deshacer la operacion que los provoco, asi que un servidor de
# correo caido NO es motivo para declarar el servicio inservible. Que el correo
# falla se ve en `smartzone_correo_total{resultado="fallido"}`, que es donde
# corresponde.
management.health.mail.enabled=false

# De quien parece que viene. Conviene que sea el mismo buzon de MAIL_USERNAME:
# Gmail reescribe el remitente si no coincide.
app.correo.remitente=${MAIL_REMITENTE:SmartZone <no-responder@smartzone.com>}
