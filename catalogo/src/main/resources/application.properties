spring.application.name=catalogo
server.port=8081

# ── Origen de la configuracion sensible ─────────────────────────
# Lee el .env de la raiz del repositorio (y uno local si existe).
# `optional:` = si falta, el servicio arranca igual.
# Las variables de entorno del sistema TIENEN PRIORIDAD sobre estos
# archivos: en produccion se inyectan sin tocar nada del codigo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=catalogo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=catalogo
spring.flyway.default-schema=catalogo
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# -- Credenciales de migracion (RLS) ------------------------------
# Flyway migra con el rol DUENO de las tablas; la aplicacion se conecta con un
# rol SIN BYPASSRLS para que las politicas de Row Level Security surtan efecto.
# Postgres ignora RLS por completo para superusuarios y roles con BYPASSRLS, y
# lo hace en silencio, asi que la app nunca debe usar el rol dueno.
#
# Efecto secundario buscado: al fijar spring.flyway.user, Flyway construye su
# propio DataSource y no pasa por el envoltorio DataSourceRls, de modo que las
# migraciones corren sin contexto de usuario y sin chocar con las politicas.
spring.flyway.user=${DB_MIGRACION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRACION_PASSWORD:${DB_PASSWORD}}

# Mismo secreto que usuarios: aqui solo se verifica la firma, y ademas se
# exige que el emisor y la audiencia coincidan (A08).
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=smartzone-usuarios
seguridad.jwt.audiencia=smartzone-api

# ── Saga: reservas de stock ─────────────────────────────────────
# Margen para que el usuario complete el pago antes de liberar el stock.
inventario.reserva.minutos=${RESERVA_MINUTOS:20}

# -- CORS (A05) ---------------------------------------------------
# Lista blanca de origenes que pueden llamar a la API desde un navegador.
# En produccion se define CORS_ORIGENES con el dominio real; el valor por
# defecto solo cubre el desarrollo local (Angular en :4200 y el gateway).
# No admite comodines: el arranque falla si se cuela un '*'.
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Proxies cuyo X-Forwarded-For nos creemos. Fuera de esta lista la cabecera se
# ignora y se usa la IP del socket: si no, cualquiera se salta el rate limit
# mandando una cabecera distinta en cada peticion.
seguridad.proxies-de-confianza=${PROXIES_DE_CONFIANZA:127.0.0.1,::1,10.,172.,192.168.}

# ── Endurecimiento (OWASP A05) ──────────────────────────────────
# ── Descubrimiento: identidad, abuso y exposicion (fase H) ──────
# El secreto de la firma del sujeto se deriva de JWT_SECRET y por eso no hay
# variable nueva; se puede separar aqui si algun dia conviene rotarlos aparte.
# descubrimiento.sujeto.secreto=

# Personas distintas que hacen falta para que un producto cuente como expuesto
# ante el freno del ranking. Impide hundir a un rival desde un solo navegador.
descubrimiento.exposicion-minima-sujetos=5

# Escrituras de ingesta por sujeto y minuto, ademas del cupo por IP.
descubrimiento.ingesta-por-sujeto-por-minuto=60

# Sujetos nuevos que una misma IP puede estrenar por minuto. Es lo que impide
# multiplicar cupos fabricando identidades.
descubrimiento.sujetos-nuevos-por-ip-por-minuto=20

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.aplicacion=catalogo
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=256KB

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

logging.level.com.backend.catalogo=INFO

# ── A donde preguntar por las compras ────────────────────────────
# Solo quien compro un producto puede valorarlo, y los pedidos viven en
# `compras`. Es la unica llamada que este servicio hace hacia otro.
servicios.compras.url=${COMPRAS_URL:http://localhost:8083}
