server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a la API van al gateway. Dentro de la red de Compose se
    # resuelve por nombre de servicio.
    location /api/ {
        proxy_pass http://web-gateway:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handshake OAuth: también lo atiende el gateway.
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://web-gateway:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets llevan hash en el nombre: se cachean sin miedo.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El router de Angular usa rutas reales (/carrito, /admin/productos...),
    # así que cualquier ruta desconocida devuelve index.html y la resuelve el
    # navegador. index.html NO se cachea, para que un despliegue se vea al
    # instante.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
