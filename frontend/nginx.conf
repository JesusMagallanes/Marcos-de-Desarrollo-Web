# Cabeceras de seguridad (A05). Cuando el bundle lo sirve nginx en vez del
# gateway, esta es la única capa que las pone.
#
# script-src 'self' es la directiva que bloquea scripts no autorizados: nada de
# inline, nada de eval, nada de CDNs. Solo el bundle propio. Un <script>
# inyectado en un campo de texto o un onerror= en una imagen no se ejecutan
# aunque alguien logre escribirlos en el DOM.
#
# style-src necesita 'unsafe-inline': index.html lleva la pantalla de carga en un
# <style> embebido y Angular inyecta estilos de componente en caliente. Los
# estilos no ejecutan código y connect-src queda cerrado a 'self'.
#
# OJO con nginx: un `add_header` dentro de un location DESCARTA todos los
# heredados del server. Por eso el mapa se repite en cada location que define
# cabeceras propias; sin esa repetición, index.html se servía sin CSP.
map $host $csp_smartzone {
    default "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No delatar la versión de nginx.
    server_tokens off;

    # Compresión. Sin esto el navegador se descargaba 821 kB de bundle inicial
    # en vez de unos 174 kB: el CSS solo (Bootstrap + FontAwesome) son 338 kB
    # que comprimen a 44 kB. En fibra no se nota; en 3G son treinta segundos de
    # diferencia, y ninguna pantalla de carga arregla eso.
    #
    # text/html no se lista a propósito: gzip lo comprime siempre que está
    # activo, y ponerlo aquí es un error habitual que nginx ignora.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    add_header Content-Security-Policy   $csp_smartzone always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Las llamadas a la API van al gateway. Dentro de la red de Compose se
    # resuelve por nombre de servicio.
    location /api/ {
        proxy_pass http://web-gateway:8080;
        # $http_host y no $host: el primero conserva el puerto tal y como lo
        # escribió el navegador. Con $host se pierde, y el backend comparaba
        # "http://localhost" contra un Origin "http://localhost:8099" para decidir
        # si la petición era del mismo origen: nunca coincidían y todas las
        # escrituras se iban en 403.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handshake OAuth: también lo atiende el gateway.
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://web-gateway:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets llevan hash en el nombre: se cachean sin miedo.
    # `expires` no se usa aquí a propósito: emite su propio Cache-Control y
    # acababan saliendo dos cabeceras distintas en la misma respuesta.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy   $csp_smartzone always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # El router de Angular usa rutas reales (/carrito, /admin/productos...),
    # así que cualquier ruta desconocida devuelve index.html y la resuelve el
    # navegador. index.html NO se cachea, para que un despliegue se vea al
    # instante.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy   $csp_smartzone always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
