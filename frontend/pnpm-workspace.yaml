allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# pnpm 10+ lee aqui la lista de paquetes autorizados a ejecutar scripts de
# instalacion. Sin ella la instalacion termina con codigo distinto de cero y
# el CLI de Angular la da por fallida.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lmdb
  - msgpackr-extract
