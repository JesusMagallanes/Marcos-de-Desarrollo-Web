@if (variante() === 'carrusel') {
  <a [routerLink]="['/producto', producto().id]" class="text-decoration-none">
    <div class="card card-producto h-100 shadow-sm rounded">
      <img [src]="producto().imageUrl || '/Img/img.png'" class="card-img-top img-fluid" [alt]="producto().name"
        loading="lazy" />
      <div class="card-body" style="font-size:14px;">
        <h6 class="fw-bold mb-1 text-uppercase">{{ producto().name }}</h6>
        <p class="fw-semibold mb-1 text-truncate" style="max-height:3rem;overflow:hidden;">
          {{ producto().description }}
        </p>
        <p class="fw-bold fs-5 mt-2 precio">S/. {{ producto().precio }}</p>
      </div>
    </div>
  </a>
} @else {
  <div class="card producto-card shadow-sm hover-card h-100">
    <img [src]="producto().imageUrl || '/Img/img.png'" class="card-img-top producto-img" [alt]="producto().name"
      loading="lazy" />
    <div class="card-body d-flex flex-column">
      <h5 class="card-title">{{ producto().name }}</h5>
      <p class="card-text text-muted producto-descripcion">{{ producto().description }}</p>
      <div class="mt-auto">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h4 class="text-success mb-0"><small>S/</small> {{ producto().precio }}</h4>
          <span class="badge" [class.bg-success]="producto().stock > 0" [class.bg-danger]="producto().stock <= 0">
            {{ producto().stock > 0 ? 'Stock: ' + producto().stock : 'Agotado' }}
          </span>
        </div>
        <a [routerLink]="['/producto', producto().id]" class="btn btn-success w-100">
          <i class="fas fa-eye me-2"></i>Ver más
        </a>
      </div>
    </div>
  </div>
}
