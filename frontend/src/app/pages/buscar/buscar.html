<div class="container-fluid px-lg-5 py-4">
  <h5 class="mb-1">Resultados para “{{ consulta() }}”</h5>
  <p class="text-muted small mb-4">{{ resultados().length }} productos encontrados</p>

  @if (cargando()) {
    <div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>
  } @else if (resultados().length) {
    <div class="rejilla-productos">
      @for (p of resultados(); track p.id) {
        <app-producto-card [producto]="p" />
      }
    </div>
  } @else {
    <div class="text-center py-5">
      <i class="fa-solid fa-magnifying-glass icono-vacio"></i>
      <h6 class="mt-3">No encontramos nada con ese término</h6>
      <p class="text-muted">Intenta con otras palabras o revisa las categorías.</p>
      <a class="btn btn-success" routerLink="/">Ver catálogo</a>
    </div>
  }
</div>
