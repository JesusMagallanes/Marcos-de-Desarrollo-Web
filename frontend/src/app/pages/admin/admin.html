<div class="contenedor-admin">
  <aside class="barra-admin">
    <div class="marca-admin">
      <img src="/Img/logo.png" alt="SmartZone" height="30" />
      <span>Admin</span>
    </div>

    <nav class="nav flex-column">
      @for (s of secciones; track s.ruta) {
        <a class="nav-link" [routerLink]="s.ruta" routerLinkActive="activo">
          <i class="fa-solid {{ s.icono }} me-2"></i>{{ s.etiqueta }}
        </a>
      }
      <hr />
      <a class="nav-link" routerLink="/envios" routerLinkActive="activo">
        <i class="fa-solid fa-truck me-2"></i>Envíos
      </a>
      <a class="nav-link" routerLink="/">
        <i class="fa-solid fa-store me-2"></i>Ver tienda
      </a>
    </nav>
  </aside>

  <main class="contenido-admin">
    <router-outlet />
  </main>
</div>
