<div class="container-fluid px-lg-5 py-4">
  <div class="row g-4">
    <aside class="col-12 col-lg-3">
      <div class="panel-lateral">
        <div class="cabecera-usuario">
          <div class="avatar">{{ iniciales() || 'U' }}</div>
          <div class="min-w-0">
            <div class="fw-bold text-truncate">{{ auth.usuario()?.name }} {{ auth.usuario()?.lastname }}</div>
            <div class="small text-muted text-truncate">{{ auth.usuario()?.emailAddress }}</div>
          </div>
        </div>

        <hr />

        <nav class="nav flex-column menu-perfil">
          <a class="nav-link" routerLink="/perfil/cuenta" routerLinkActive="activo">
            <i class="fa-solid fa-user me-2"></i>Mi cuenta
          </a>
          <a class="nav-link" routerLink="/perfil/compras" routerLinkActive="activo">
            <i class="fa-solid fa-bag-shopping me-2"></i>Mis compras
          </a>
          @if (auth.esAdminPanel()) {
            <a class="nav-link" routerLink="/admin" routerLinkActive="activo">
              <i class="fa-solid fa-user-gear me-2"></i>Panel admin
            </a>
          }
          @if (auth.tienePermiso('PEDIDOS_GESTIONAR')) {
            <a class="nav-link" routerLink="/admin/envios" routerLinkActive="activo">
              <i class="fa-solid fa-truck me-2"></i>Envíos
            </a>
          }
          <button type="button" class="nav-link text-danger text-start" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar sesión
          </button>
        </nav>
      </div>
    </aside>

    <div class="col-12 col-lg-9">
      <router-outlet />
    </div>
  </div>
</div>
