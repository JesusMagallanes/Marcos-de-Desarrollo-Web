spring.application.name=compras
server.port=8083

# ── Origen de la configuracion sensible ─────────────────────────
# Lee el .env de la raiz del repositorio (y uno local si existe).
# `optional:` = si falta, el servicio arranca igual.
# Las variables de entorno del sistema TIENEN PRIORIDAD sobre estos
# archivos: en produccion se inyectan sin tocar nada del codigo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=compras
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=compras
spring.flyway.default-schema=compras
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# -- Credenciales de migracion (RLS) ------------------------------
# Flyway migra con el rol DUENO de las tablas; la aplicacion se conecta con un
# rol SIN BYPASSRLS para que las politicas de Row Level Security surtan efecto.
# Postgres ignora RLS por completo para superusuarios y roles con BYPASSRLS, y
# lo hace en silencio, asi que la app nunca debe usar el rol dueno.
#
# Efecto secundario buscado: al fijar spring.flyway.user, Flyway construye su
# propio DataSource y no pasa por el envoltorio DataSourceRls, de modo que las
# migraciones corren sin contexto de usuario y sin chocar con las politicas.
spring.flyway.user=${DB_MIGRACION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRACION_PASSWORD:${DB_PASSWORD}}

seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=smartzone-usuarios
seguridad.jwt.audiencia=smartzone-api

# ── Catalogo ────────────────────────────────────────────────────
# Unica dependencia saliente: precios y stock.
servicios.catalogo.url=${CATALOGO_URL:http://localhost:8081}
servicios.catalogo.timeout-conexion=3s
servicios.catalogo.timeout-lectura=5s

# ── MercadoPago ─────────────────────────────────────────────────
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.api-url=https://api.mercadopago.com
# Base publica a la que MercadoPago devuelve al comprador.
mercadopago.retorno-base=${MP_RETORNO_BASE:http://localhost:4200}
# Secreto para verificar la firma de los webhooks (A08). Sin el, se rechazan.
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
# URL PUBLICA del webhook, la que MercadoPago llama para avisar del cobro.
# Vacia = no se manda notification_url y MercadoPago no avisa de nada: la venta
# solo se cierra si el comprador vuelve a la tienda por su propio pie.
mercadopago.notificacion-url=${MP_NOTIFICACION_URL:}

# ── Saga de compra ──────────────────────────────────────────────
# Margen antes de dar el pago por abandonado y compensar. Debe ser MAYOR que
# inventario.reserva.minutos de catalogo, que es la segunda red de seguridad.
compras.saga.minutos-abandono=${SAGA_MINUTOS_ABANDONO:25}
compras.saga.max-intentos-compensacion=5

# ── Reglas de negocio ───────────────────────────────────────────
compras.envio.umbral-gratis=200.00
compras.envio.costo=15.00

# -- CORS (A05) ---------------------------------------------------
# Lista blanca de origenes que pueden llamar a la API desde un navegador.
# En produccion se define CORS_ORIGENES con el dominio real; el valor por
# defecto solo cubre el desarrollo local (Angular en :4200 y el gateway).
# No admite comodines: el arranque falla si se cuela un '*'.
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# Proxies cuyo X-Forwarded-For nos creemos. Fuera de esta lista la cabecera se
# ignora y se usa la IP del socket: si no, cualquiera se salta el rate limit
# mandando una cabecera distinta en cada peticion.
seguridad.proxies-de-confianza=${PROXIES_DE_CONFIANZA:127.0.0.1,::1,10.,172.,192.168.}

# ── Endurecimiento (OWASP A05) ──────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.aplicacion=compras
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=256KB

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

logging.level.com.backend.compras=INFO

# ── Punto de salida de los repartos (Epica 3) ────────────────────
# Desde aqui se calcula la distancia a cada entrega. Se configura porque una
# tienda se muda y dejarlo en el codigo obligaria a recompilar.
# El valor por defecto es el centro de Lima, util para desarrollo.
#
# OJO con lo que ES este calculo: distancia en linea recta con un ajuste por
# callejero, NO una ruta. No conoce calles, sentidos ni trafico. La respuesta lo
# marca con `distanciaEsEstimada` y la interfaz escribe "aprox.".
compras.tienda.latitud=${TIENDA_LATITUD:-12.046374}
compras.tienda.longitud=${TIENDA_LONGITUD:-77.042793}
