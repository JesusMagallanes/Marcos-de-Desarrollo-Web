spring.application.name=web-gateway
server.port=8080

# ── Origen de la configuracion sensible ─────────────────────────
# Lee el .env de la raiz del repositorio (y uno local si existe).
# `optional:` = si falta, el servicio arranca igual.
# Las variables de entorno del sistema TIENEN PRIORIDAD sobre estos
# archivos: en produccion se inyectan sin tocar nada del codigo.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]


# ── Destinos ────────────────────────────────────────────────────
servicios.catalogo.url=${CATALOGO_URL:http://localhost:8081}
servicios.usuarios.url=${USUARIOS_URL:http://localhost:8082}
servicios.compras.url=${COMPRAS_URL:http://localhost:8083}

# Mismo secreto que el resto: aqui solo se verifica la firma, el emisor y la
# audiencia, para descartar cuanto antes lo que ya se sabe invalido.
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.emisor=smartzone-usuarios
seguridad.jwt.audiencia=smartzone-api

# ── Endurecimiento (OWASP A05) ──────────────────────────────────
# Metricas para Prometheus. Se exponen health y prometheus, nada mas: `env`
# o `beans` filtrarian configuracion interna.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.aplicacion=web-gateway
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Limite del cuerpo: el gateway no recibe subidas de archivos.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=256KB
# Corta cabeceras desmesuradas antes de procesarlas.
server.max-http-request-header-size=16KB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Cache larga para los assets con hash en el nombre; el index.html no se cachea.
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.chain.compressed=true

logging.level.org.springframework.cloud.gateway=INFO
